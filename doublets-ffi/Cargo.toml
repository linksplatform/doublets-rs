[package]
publish = false
name = "doublets-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = [
    "uselessgoddess",
    "Linksplatform Team <linksplatformtechnologies@gmail.com>"
]
license = "Unlicense"
repository = "https://github.com/linksplatform/doublets-rs"
homepage = "https://github.com/linksplatform/doublets-rs"
description = "FFI bindings for the doublets library"
readme = "../README.md"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
doublets = { path = "../doublets", features = ["ffi"] }
log = { version = "0.4.34", features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
